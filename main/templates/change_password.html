{% extends "base.html" %}

{% block meta %}
  <title>Ubah Password</title>
{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-12">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8 space-y-6">

    <h1 class="text-2xl font-bold text-center text-gray-800 dark:text-gray-100">
      Ubah Password
    </h1>

    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Password Lama
          </label>
          <input type="password" name="old_password"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700
                        dark:border-gray-600 dark:text-gray-100" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Password Baru
          </label>
          <input type="password" name="new_password1"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700
                        dark:border-gray-600 dark:text-gray-100" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Konfirmasi Password Baru
          </label>
          <input type="password" name="new_password2"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700
                        dark:border-gray-600 dark:text-gray-100" required>
        </div>
      </div>

      <div class="flex justify-center gap-6 pt-6">
        <button type="submit"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Simpan
        </button>
        <a href="{% url 'profile' %}"
           class="px-6 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600
                  text-gray-800 dark:text-gray-100 rounded-lg font-semibold">
          Batal
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock content %}
