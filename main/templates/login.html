{% extends "base.html" %}
{% load static %}

{% block meta %}<title>Login</title>{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
  <div class="w-full max-w-md p-8 space-y-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-gray-100">Login</h2>

    <form method="post">
      {% csrf_token %}

      <!-- Username -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
        <input id="username" name="username" type="text"
               class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                      focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100"
               required>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
        <input id="password" name="password" type="password"
               class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                      focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100"
               required>
      </div>

      <button type="submit" class="w-full px-4 py-2 font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg">
        Login
      </button>
    </form>

    <p class="text-sm text-center text-gray-600 dark:text-gray-400">
      Belum punya akun?
      <a href="{% url 'register' %}" class="text-blue-500 hover:underline">Register di&nbsp;sini</a>
    </p>
  </div>
</div>
{% endblock content %}
