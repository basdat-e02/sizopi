{% extends "base.html" %}
{% load static %}

{% block meta %}<title>Registrasi Staff</title>{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
  <div class="w-full max-w-3xl p-8 space-y-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-gray-100">Registrasi Staff</h2>

    <form method="post">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
          <input name="username" type="text"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
          <input name="email" type="email"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
          <input name="password1" type="password"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Konfirmasi Password</label>
          <input name="password2" type="password"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Nama Depan -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nama Depan</label>
          <input name="first_name" type="text"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Nama Tengah -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nama Tengah</label>
          <input name="middle_name" type="text"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100">
        </div>

        <!-- Nama Belakang -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nama Belakang</label>
          <input name="last_name" type="text"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Nomor Telepon -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nomor Telepon</label>
          <input name="phone" type="text"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 dark:text-gray-100"
                 required>
        </div>

        <!-- Peran Staff -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Peran Staff</label>
          <div class="space-y-2 text-gray-700 dark:text-gray-300">
            <label class="flex items-center"><input type="radio" name="role" value="PJH" class="mr-2"> Penjaga Hewan (PJH)</label>
            <label class="flex items-center"><input type="radio" name="role" value="ADM" class="mr-2"> Staf Administrasi (ADM)</label>
            <label class="flex items-center"><input type="radio" name="role" value="PLP" class="mr-2"> Pelatih Pertunjukan (PLP)</label>
          </div>
        </div>

        <!-- ID Staff -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">ID Staff (otomatis)</label>
          <input name="staff_id" type="text" value=""
                 class="w-full px-3 py-2 border rounded-lg bg-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
        </div>
      </div>

      <button type="submit"
              class="w-full mt-6 px-4 py-2 font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg">
        Daftar
      </button>
    </form>

    <p class="text-sm text-center text-gray-600 dark:text-gray-400">
      <a href="{% url 'register' %}" class="text-blue-500 hover:underline">Kembali ke Pilih Role</a> |
      <a href="{% url 'login' %}"    class="text-blue-500 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock content %}
