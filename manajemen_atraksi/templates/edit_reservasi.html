{% extends 'base.html' %}
{% block content %}
{% include "navbar.html" %}

<div class="min-h-screen bg-gray-900 py-12 px-6">
    <div class="max-w-xl mx-auto bg-gray-800 rounded-lg shadow-lg p-8 text-white">
        <h2 class="text-2xl font-bold mb-6">Edit Reservasi</h2>

        <form method="POST" action="{% url 'manajemen_atraksi:update_reservasi' %}" class="space-y-6">
            {% csrf_token %}

            <input type="hidden" name="old_fasilitas" value="{{ reservasi.0 }}">
            <input type="hidden" name="old_tanggal" value="{{ reservasi.1|date:'Y-m-d' }}">

            <div>
                <label class="block mb-1 font-semibold">Wahana:</label>
                <select name="nama_fasilitas" required
                        class="w-full p-3 rounded bg-gray-700 border border-gray-600">
                    {% for w in wahana_list %}
                        <option value="{{ w.0 }}" {% if w.0 == reservasi.0 %}selected{% endif %}>
                            {{ w.0 }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 font-semibold">Tanggal Kunjungan:</label>
                <input type="date" name="tanggal_kunjungan"
                       value="{{ reservasi.1|date:'Y-m-d' }}" required
                       class="w-full p-3 rounded bg-gray-700 border border-gray-600">
            </div>

            <div>
                <label class="block mb-1 font-semibold">Jumlah Tiket:</label>
                <input type="number" name="jumlah_tiket" min="1"
                       value="{{ reservasi.2 }}" required
                       class="w-full p-3 rounded bg-gray-700 border border-gray-600">
            </div>

            <div class="flex justify-end space-x-3">
                <a href="{% url 'manajemen_atraksi:detail_reservasi' reservasi.0 reservasi.1|date:'Y-m-d' %}"
                   class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Kembali</a>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
