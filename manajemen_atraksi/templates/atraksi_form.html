{% extends 'base.html' %}

{% block content %}
{% include "navbar.html" %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<div class="min-h-screen bg-gray-100 dark:bg-gray-900 py-12 px-6">
    <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 space-y-6">

        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800 dark:text-gray-100">{{ action }} Atraksi</h1>
        </div>

        {% if error %}
        <div class="text-red-500 bg-red-100 p-2 rounded-md">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">

<!-- Nama Atraksi -->
<div>
    <label for="nama" class="block text-sm font-semibold text-white">Nama Atraksi</label>
    <input type="text" name="nama" id="nama" class="bg-gray-700 text-white w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ atraksi.nama|default:'' }}" required>
</div>

<!-- Jadwal -->
<div>
    <label for="jadwal" class="block text-sm font-semibold text-white">Jadwal</label>
    <input type="datetime-local" name="jadwal" id="jadwal" class="bg-gray-700 text-white w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ atraksi.jadwal|default:'' }}" required>
</div>

<!-- Kapasitas -->
<div>
    <label for="kapasitas" class="block text-sm font-semibold text-white">Kapasitas Maksimum</label>
    <input type="number" name="kapasitas" id="kapasitas" class="bg-gray-700 text-white w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ atraksi.kapasitas|default:'' }}" required>
</div>

<!-- Lokasi -->
<div>
    <label for="lokasi" class="block text-sm font-semibold text-white">Lokasi</label>
    <input type="text" name="lokasi" id="lokasi" class="bg-gray-700 text-white w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ atraksi.lokasi|default:'' }}" required>
</div>


                <!-- Pelatih Checkboxes -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-white mb-2">Pelatih</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        {% for pelatih in pelatih_list %}
                        <div class="flex items-center">
                            <input type="checkbox" name="pelatih" id="pelatih-{{ pelatih.username_lh }}" 
                                   value="{{ pelatih.username_lh }}" 
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                   {% if atraksi and pelatih.username_lh in atraksi.pelatih %}checked{% endif %}>
                            <label for="pelatih-{{ pelatih.username_lh }}" class="ml-2 block text-sm text-gray-300">
                                {{ pelatih.username_lh }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Hewan Checkboxes -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-white mb-2">Hewan yang Terlibat</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        {% for hewan in hewan_list %}
                        <div class="flex items-center">
                            <input type="checkbox" name="hewan" id="hewan-{{ hewan.id }}" 
                                   value="{{ hewan.id|stringformat:"s" }}"
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                   {% if atraksi and hewan.id in atraksi.hewan_terlibat %}checked{% endif %}>
                            <label for="hewan-{{ hewan.id }}" class="ml-2 block text-sm text-gray-300">
                                {{ hewan.nama }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="mt-6 flex justify-end">
                    <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        Simpan
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>



<!-- Initialize Select2 -->
<style>
/* Additional dark mode styling */
.select2-container--default .select2-results__option[aria-selected=true] {
    background-color: #4b5563;
}
.select2-container--default .select2-results__option--highlighted[aria-selected] {
    background-color: #3b82f6;
}
.select2-dropdown {
    background-color: #374151;
    border-color: #4b5563;
}
</style>
<script>
$(document).ready(function() {
    // Initialize pelatih select
    $('.pelatih-select').select2({
        placeholder: "Pilih Pelatih",
        allowClear: true,
        width: '100%',
        theme: 'dark'
    });
    
    // Initialize hewan select
    $('.hewan-select').select2({
        placeholder: "Pilih Hewan",
        allowClear: true,
        width: '100%',
        theme: 'dark'
    });
    
    // Dark mode adaptations
    $('.select2-container--default .select2-selection--multiple').addClass('bg-gray-700 border-gray-600');
    $('.select2-container--default .select2-search__field').addClass('text-white');
    $('.select2-container--default .select2-selection__choice').addClass('bg-gray-600 border-gray-500 text-white');
});
</script>

{% endblock %}
