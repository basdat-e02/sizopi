{% extends 'base.html' %}

{% block content %}`
{% include "navbar.html" %}

<div class="min-h-screen bg-gray-900 text-white py-10 px-6">
  <div class="max-w-4xl mx-auto bg-gray-800 rounded-xl shadow-lg p-8 space-y-6">

    <h2 class="text-2xl font-bold border-b border-gray-700 pb-2">{{ action }} Wahana</h2>

    <form method="post" class="space-y-6 needs-validation" novalidate>
      {% csrf_token %}

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="nama" class="block text-sm font-medium mb-1">Nama Wahana</label>
          <input type="text" id="nama" name="nama"
                 class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 value="{{ wahana.nama|default:'' }}" required>
        </div>

        <div>
          <label for="kapasitas" class="block text-sm font-medium mb-1">Kapasitas Maksimum</label>
          <input type="number" id="kapasitas" name="kapasitas"
                 class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 value="{{ wahana.kapasitas|default:'' }}" min="1" required>
        </div>

        <div class="md:col-span-2">
          <label for="jadwal" class="block text-sm font-medium mb-1">Jadwal</label>
          <input type="datetime-local" id="jadwal" name="jadwal"
                 class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                 value="{{ wahana.jadwal|date:'Y-m-d\\TH:i'|default:'' }}" required>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Peraturan</label>
        <div id="peraturan-container" class="space-y-2">
          {% if peraturan_items %}
            {% for peraturan in peraturan_items %}
            <div class="flex gap-2 peraturan-item">
              <input type="text" name="peraturan"
                     class="flex-1 bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2"
                     value="{{ peraturan }}" required>
              <button type="button" class="text-red-400 hover:text-red-600 hapus-peraturan">
                <i class="bi bi-trash"></i>
              </button>
            </div>
            {% endfor %}
          {% else %}
            <div class="flex gap-2 peraturan-item">
              <input type="text" name="peraturan"
                     class="flex-1 bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2"
                     required>
              <button type="button" class="text-red-400 hover:text-red-600 hapus-peraturan">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          {% endif %}
        </div>
        <button type="button" id="tambah-peraturan"
                class="mt-2 text-sm text-blue-400 hover:underline">
          <i class="bi bi-plus-circle"></i> Tambah Peraturan
        </button>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-gray-700">
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-md shadow">
          <i class="bi bi-save"></i> Simpan
        </button>
        <a href="{% url 'manajemen_atraksi:wahana_list' %}"
           class="text-gray-300 hover:underline">
          <i class="bi bi-x-circle"></i> Batal
        </a>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('tambah-peraturan').addEventListener('click', function () {
    const container = document.getElementById('peraturan-container');
    const newField = document.createElement('div');
    newField.classList.add('flex', 'gap-2', 'peraturan-item', 'mt-2');
    newField.innerHTML = `
      <input type="text" name="peraturan"
             class="flex-1 bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2"
             required>
      <button type="button" class="text-red-400 hover:text-red-600 hapus-peraturan">
        <i class="bi bi-trash"></i>
      </button>
    `;
    container.appendChild(newField);
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('.hapus-peraturan')) {
      const item = e.target.closest('.peraturan-item');
      item.remove();
    }
  });

  var forms = document.querySelectorAll('.needs-validation');
  Array.prototype.slice.call(forms).forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  });
});
</script>

{% endblock %}
