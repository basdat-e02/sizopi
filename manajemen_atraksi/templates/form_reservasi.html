{% extends 'base.html' %}
{% block content %}
{% include "navbar.html" %}

<div class="min-h-screen bg-gray-900 py-12 px-6">
  <div class="max-w-3xl mx-auto bg-gray-800 text-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Reservasi Atraksi / Wahana</h2>

    <form method="POST" action="{% url 'manajemen_atraksi:simpan_reservasi' %}" class="space-y-6">
      {% csrf_token %}

      <div>
        <label for="nama_fasilitas" class="block mb-2 font-semibold">Pilih Atraksi / Wahana:</label>
        <select name="nama_fasilitas" id="nama_fasilitas" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none">
          {% for a in atraksi %}
            <option value="{{ a.0 }}">{{ a.0 }} - {{ a.1|date:"Y-m-d H:i" }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="tanggal" class="block mb-2 font-semibold">Tanggal Kunjungan:</label>
        <input type="date" name="tanggal_kunjungan" id="tanggal" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none">
      </div>

      <div>
        <label for="jumlah_tiket" class="block mb-2 font-semibold">Jumlah Tiket:</label>
        <input type="number" name="jumlah_tiket" id="jumlah_tiket" min="1" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none">
      </div>

      <div class="flex justify-end space-x-4">
        <a href="{% url 'manajemen_atraksi:list_reservasi_pengunjung' %}" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">
          ← Kembali
        </a>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-semibold">
          Reservasi
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
