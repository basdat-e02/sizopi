{% extends "base.html" %}
{% block meta %}<title>Edit Satwa</title>{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-12">
  <div class="w-full max-w-2xl bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-xl font-bold mb-6 text-gray-800 dark:text-gray-100 text-center">FORM EDIT DATA SATWA</h1>

    <form method="post">
      {% csrf_token %}
      <div class="space-y-6">

        <div>
          <label for="nama" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Nama Individu
          </label>
          <input id="nama" name="nama" type="text" value="Simba"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="spesies" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Spesies</label>
          <input id="spesies" name="spesies" type="text" value="Singa"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="asal" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Asal Hewan</label>
          <input id="asal" name="asal" type="text" value="Afrika"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="tanggal_lahir" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Tanggal Lahir
          </label>
          <input id="tanggal_lahir" name="tanggal_lahir" type="date" value="2018-05-12"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="status_kesehatan" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Status Kesehatan
          </label>
          <select id="status_kesehatan" name="status_kesehatan"
                  class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                         focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
            <option selected>Sehat</option>
            <option>Sakit</option>
            <option>Dalam Pemantauan</option>
          </select>
        </div>

        <div>
          <label for="habitat" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Nama Habitat
          </label>
          <select id="habitat" name="habitat"
                  class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                         focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
            <option selected>Savana</option>
            <option>Hutan Tropis</option>
          </select>
        </div>

        <div>
          <label for="foto" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            URL Foto Satwa
          </label>
          <input id="foto" name="foto" type="text" value="https://example.com/simba.jpg"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>
      </div>

      <div class="flex justify-center gap-4 mt-8">
        <button type="submit"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          SIMPAN PERUBAHAN
        </button>
        <a href="{% url 'view_satwa' %}"
           class="px-6 py-2 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-white rounded-lg hover:bg-gray-400 font-semibold">
          BATAL
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
