{% extends "base.html" %}
{% block meta %}<title>Tambah Habitat</title>{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-12">
  <div class="w-full max-w-2xl bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-xl font-bold mb-6 text-gray-800 dark:text-gray-100 text-center">FORM TAMBAH HABITAT</h1>

    <form method="post">
      {% csrf_token %}
      <div class="space-y-6">

        <div>
          <label for="nama" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Nama Habitat
          </label>
          <input id="nama" name="nama" type="text"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100" required>
        </div>

        <div>
          <label for="luas_area" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Luas Area (dalam m²)
          </label>
          <input id="luas_area" name="luas_area" type="number" step="0.01"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100" required>
        </div>

        <div>
          <label for="kapasitas" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Kapasitas Maksimal (jumlah hewan)
          </label>
          <input id="kapasitas" name="kapasitas" type="number"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100" required>
        </div>

        <div>
          <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Status Lingkungan
          </label>
          <textarea id="status" name="status" rows="4"
                    class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                           focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100"
                    placeholder="Contoh: Suhu: 28°C, Kelembapan: 70%, Vegetasi lebat" required></textarea>
        </div>
      </div>

      <div class="flex justify-end mt-8">
        <button type="submit"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Tambah Habitat
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
