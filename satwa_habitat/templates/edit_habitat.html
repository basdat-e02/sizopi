{% extends "base.html" %}
{% block meta %}<title>Edit Habitat</title>{% endblock meta %}

{% block content %}
{% include "navbar.html" %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-12">
  <div class="w-full max-w-2xl bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-xl font-bold mb-6 text-gray-800 dark:text-gray-100 text-center">FORM EDIT HABITAT</h1>

    <form method="post">
      {% csrf_token %}
      <div class="space-y-6">

        <div>
          <label for="nama" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nama Habitat</label>
          <input id="nama" name="nama" type="text" value="Savana"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="luas_area" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Luas Area (m²)
          </label>
          <input id="luas_area" name="luas_area" type="text" value="5000"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="kapasitas" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Kapasitas Maksimal (hewan)
          </label>
          <input id="kapasitas" name="kapasitas" type="number" value="25"
                 class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">
        </div>

        <div>
          <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Status Lingkungan
          </label>
          <textarea id="status" name="status" rows="4"
                    class="w-full px-3 py-2 mt-1 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                           focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100">Suhu: 30°C, Kelembapan: 40%, Vegetasi: Rumput</textarea>
        </div>
      </div>

      <div class="flex justify-center gap-4 mt-8">
        <button type="submit"
                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          SIMPAN PERUBAHAN
        </button>
        <a href="{% url 'view_habitat' %}"
           class="px-6 py-2 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-400 rounded-lg font-semibold">
          BATAL
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
