{% extends "base.html" %}
{% block meta %}<title>Pendataan Adopter</title>{% endblock meta %}
{% block content %}
{% include "navbar.html" %}

<div class="max-w-lg mx-auto bg-white dark:bg-gray-800 rounded-lg shadow p-6 mt-10">
  <h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-gray-100">
    Verifikasi Akun Adopter untuk Hewan {{ id_hewan }}
  </h2>

  {% if error %}
    <div class="mb-4 p-2 bg-red-100 text-red-700 rounded">
      {{ error }}
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="step" value="lookup">
    <div class="mb-4">
      <label class="block font-semibold text-gray-800 dark:text-gray-100">Pilih Jenis Adopter</label>
      <label class="inline-flex items-center mr-4">
        <input type="radio" name="jenis" value="individu" checked class="form-radio"/>
        <span class="ml-2 text-gray-700 dark:text-gray-300">Individu</span>
      </label>
      <label class="inline-flex items-center">
        <input type="radio" name="jenis" value="organisasi" class="form-radio"/>
        <span class="ml-2 text-gray-700 dark:text-gray-300">Organisasi</span>
      </label>
    </div>

    <div class="mb-4">
      <label for="username" class="block font-semibold text-gray-800 dark:text-gray-100">
        Username Pengunjung
      </label>
      <input type="text" id="username" name="username" required
             class="w-full border rounded px-3 py-2 mt-1
                    text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-gray-700"
             placeholder="Masukkan username..." />
    </div>

    <div class="flex justify-end">
      <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Verifikasi Akun
      </button>
    </div>
  </form>
</div>
{% endblock content %}
