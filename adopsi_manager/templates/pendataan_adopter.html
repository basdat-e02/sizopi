{% extends "base.html" %}
{% block meta %}<title>Pendataan Adopter</title>{% endblock meta %}
{% block content %}
{% include "navbar.html" %}

<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 py-12 px-6">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-xl font-bold mb-6 text-gray-800 dark:text-gray-100 text-center">
      PENDATAAN ADOPTER
    </h1>
    {% if error %}
      <p class="text-sm text-red-600 mb-4">{{ error }}</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Username Calon Adopter
          </label>
          <input name="username" type="text" value="{{ request.POST.username }}"
                 class="w-full px-3 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600
                        focus:outline-none focus:ring focus:border-blue-400 dark:text-gray-100"
                 required>
        </div>
        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Adopsi sebagai</span>
          <label class="inline-flex items-center">
            <input type="radio" name="jenis" value="individu"
                   class="form-radio" 
                   {% if request.POST.jenis != "organisasi" %}checked{% endif %}>
            <span class="ml-2 dark:text-gray-100">Individu</span>
          </label>
          <label class="inline-flex items-center ml-6">
            <input type="radio" name="jenis" value="organisasi" class="form-radio"
                   {% if request.POST.jenis == "organisasi" %}checked{% endif %}>
            <span class="ml-2 dark:text-gray-100">Organisasi</span>
          </label>
        </div>
      </div>
      <div class="flex justify-end gap-4 mt-6">
        <a href="{% url 'view_adopsi' %}"
           class="px-4 py-2 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-white rounded-lg hover:bg-gray-400">
          Batal
        </a>
        <button type="submit"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
          Verifikasi Akun
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
