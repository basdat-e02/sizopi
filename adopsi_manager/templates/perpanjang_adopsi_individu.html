{% extends "base.html" %}
{% block meta %}<title>Perpanjang Adopsi Individu</title>{% endblock meta %}
{% block content %}
  {% include "navbar.html" %}
  <div class="max-w-2xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-4">Perpanjang Adopsi Individu</h2>

    <form method="post"
          action="{% url 'extend_adopsi' id_adopter id_hewan tgl_mulai_adopsi %}">
      {% csrf_token %}
      <!-- Form inputs periode & kontribusi -->
      <div class="space-x-3 mt-4">
        <button type="submit"
                class="px-4 py-2 bg-green-600 text-white rounded">Perpanjang</button>
        <!-- **Gunakan positional args** juga di URL tag 'detail_adopsi_adopter' -->
        <a href="{% url 'detail_adopsi_adopter' id_adopter id_hewan tgl_mulai_adopsi %}"
           class="px-4 py-2 bg-gray-300 text-gray-800 rounded">Batal</a>
      </div>

      {% if error %}
        <p class="text-red-500 mt-2">{{ error }}</p>
      {% endif %}
    </form>
  </div>
{% endblock content %}
