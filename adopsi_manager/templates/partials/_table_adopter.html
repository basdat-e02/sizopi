{% load humanize %}
<table class="w-full table-auto text-sm text-gray-800 dark:text-gray-100 border">
  <thead class="bg-gray-200 dark:bg-gray-700 font-semibold">
    <tr>
      <th class="border px-4 py-2">Nama Adopter</th>
      <th class="border px-4 py-2">Total Kontribusi</th>
      <th class="border px-4 py-2">Riwayat Adopsi</th>
      <th class="border px-4 py-2">Aksi</th>
    </tr>
  </thead>

  <tbody>
    {% for a in data %}
    <tr class="bg-white dark:bg-gray-800">
      <td class="border px-4 py-2">{{ a.nama }}</td>
      <td class="border px-4 py-2">Rp{{ a.total|intcomma }}</td>
      <td class="border px-4 py-2">
        <a href="{% url 'riwayat_adopsi_adopter' a.id %}"
           class="text-blue-500 hover:underline">
           Lihat Detail
        </a>
      </td>
      <td class="border px-4 py-2 text-center">
        {% if not a.aktif %}
          <form method="post" action="{% url 'daftar_adopter' %}">
            {% csrf_token %}
            <input type="hidden" name="adopter_id" value="{{ a.id }}">
            <button type="submit"
                    class="text-red-500 hover:underline"
                    onclick="return confirm('Hapus adopter ini?');">
              Hapus
            </button>
          </form>
        {% else %}
          <span class="text-gray-400 cursor-not-allowed"
                title="Masih aktif beradopsi">
                Hapus
          </span>
        {% endif %}
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="4" class="border px-4 py-4 text-center">Tidak ada data.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
