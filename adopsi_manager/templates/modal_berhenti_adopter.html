{% extends "base.html" %}
{% block meta %}<title>Konfirmasi Berhenti Adopsi</title>{% endblock meta %}
{% block content %}
{% include "navbar.html" %}

<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 max-w-sm w-full">
    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">Berhenti Adopsi</h2>
    <p class="text-gray-700 dark:text-gray-300 mb-6">
      Apakah Anda yakin ingin berhenti mengadopsi satwa ini?
    </p>
    <div class="flex justify-end space-x-4">
      <form method="post" action="{% url 'cancel_adopsi' adopsi.id %}">
        {% csrf_token %}
        <button type="submit"
                class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold">
          Iya
        </button>
      </form>
      <a href="{% url 'detail_adopsi_adopter' adopsi.id %}"
         class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg font-semibold">
        Batal
      </a>
    </div>
  </div>
</div>
{% endblock content %}
