{% extends 'base.html' %}
{% block content %}
<table class="min-w-full">
  <thead>…</thead>
  <tbody>
    {% for a in adopsi_list %}
      <tr class="bg-white dark:bg-gray-800">
        <td class="border px-4 py-2">
          <img src="{{ a.foto_url }}" alt="{{ a.nama_hewan }}" class="h-16 w-16 object-cover rounded">
        </td>
        <td class="border px-4 py-2">{{ a.nama_hewan }}</td>
        <td class="border px-4 py-2">{{ a.jenis }}</td>
        <td class="border px-4 py-2">{{ a.kondisi }}</td>
        <td class="border px-4 py-2">
          {% if a.tgl_mulai_adopsi %}
            <a href="{% url 'detail_adopsi_adopter' a.id_adopter a.id_hewan a.tgl_mulai_adopsi %}"
               class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
              Lihat Detail
            </a>
          {% else %}
            <span class="text-gray-500">—</span>
          {% endif %}
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="5" class="border px-4 py-2 text-center">
          Kamu belum mengadopsi satwa apapun.
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
